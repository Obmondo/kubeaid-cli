git:
  sshUsername: git
  useSSHAgent: true

forkURLs:
  kubeaid:
    url: https://github.com/Obmondo/kubeaid.git
    version: 31.0.4
  kubeaidConfig:
    url: git@github.com:acme/kubeaid-config.git
    directory: 

cluster:
  type: workload
  name: aws-acme
  k8sVersion: v1.35.6
  enableAuditLogging: false
  apiServer:
    extraArgs: {}
    extraVolumes: []
    files: []
  netbird:
    dns: netbird.vpn.acme.com
    dnsZone: aws-acme.local
  argoCD:
    deployKeys:
      kubeaidConfig:
        privateKeyFilePath: /tmp/ssh-priv

cloud:
  aws:
    region: eu-west-1
    sshKeyName: aws-acme
    bastionEnabled: true
    controlPlane:
      loadBalancerScheme: internet-facing
      replicas: 3
      instanceType: t3.medium
      ami:
        id: ami-0123456789abcdef0
    # cpu / memory feed the cluster-autoscaler scale-from-zero capacity
    # annotations — keep them in sync if you change instanceType. The AMI must
    # match the instance type's architecture.
    nodeGroups:
      - name: default
        minSize: 3
        maxSize: 6
        cpu: 4
        memory: 8
        instanceType: t3.medium
        rootVolumeSize: 35
        sshKeyName: aws-acme
        ami:
          id: ami-0123456789abcdef0

