git:
  sshUsername: git
  useSSHAgent: true

forkURLs:
  kubeaid:
    url: https://github.com/Obmondo/kubeaid.git
    version: 31.0.4
  kubeaidConfig:
    url: git@github.com:acme/kubeaid-config.git
    directory: 

cluster:
  type: workload
  name: azure-acme
  k8sVersion: v1.35.6
  enableAuditLogging: false
  apiServer:
    extraArgs: {}
    extraVolumes: []
    files: []
  argoCD:
    deployKeys:
      kubeaidConfig:
        privateKeyFilePath: /tmp/ssh-priv

cloud:
  azure:
    tenantID: 11111111-1111-1111-1111-111111111111
    subscriptionID: 22222222-2222-2222-2222-222222222222
    location: westeurope
    storageAccount: azureacmestorage
    controlPlane:
      loadBalancerType: Public
      diskSizeGB: 128
      vmSize: Standard_D2s_v3
      replicas: 3

