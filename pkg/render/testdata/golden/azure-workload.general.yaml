git:
  sshUsername: git
  useSSHAgent: true

forkURLs:
  kubeaid:
    url: https://github.com/Obmondo/kubeaid.git
    version: 31.0.4
  kubeaidConfig:
    url: git@github.com:acme/kubeaid-config.git
    directory:

cluster:
  type: workload
  name: azure-acme
  k8sVersion: v1.35.6
  enableAuditLogging: false
  apiServer:
    extraArgs: {}
    extraVolumes: []
    files: []
  argoCD:
    deployKeys:
      kubeaidConfig:
        privateKeyFilePath: /tmp/ssh-priv

cloud:
  azure:
    tenantID: 11111111-1111-1111-1111-111111111111
    subscriptionID: 22222222-2222-2222-2222-222222222222
    location: westeurope
    storageAccount: azureacmestorage
    aadApplication:
      principalID: 44444444-4444-4444-4444-444444444444
    workloadIdentity:
      openIDProviderSSHKeyPair:
        privateKeyFilePath: /home/ops/.ssh/azure-oidc-issuer
        publicKeyFilePath: /home/ops/.ssh/azure-oidc-issuer.pub
    sshPublicKey: "ssh-rsa AAAAB3FAKEKEY ops@acme.com"
    canonicalUbuntuImage:
      offer: ubuntu-26_04-lts
      sku: server
    controlPlane:
      loadBalancerType: Public
      diskSizeGB: 128
      vmSize: Standard_D2s_v3
      replicas: 3
    # cpu / memory feed the cluster-autoscaler scale-from-zero capacity
    # annotations — keep them in sync if you change vmSize.
    nodeGroups:
      - name: default
        minSize: 3
        maxSize: 6
        cpu: 4
        memory: 8
        vmSize: Standard_F4s_v2
        diskSizeGB: 128

